name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: signalsource_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:concurrency
        env:
          TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/signalsource_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
